<header class="header">
  <span class="header__title">Аня и Мяумяф</span>

  <nav class="nav">
    <ul class="nav__ul">
      <li class="nav__item">
        <a class="nav__link" routerLink="/home">
          <mat-icon svgIcon="home-main" class="nav__svg-main"></mat-icon>
          Главная
        </a>
      </li>

      <li class="nav__item">
        <a class="nav__link" routerLink="/blog">
          <mat-icon svgIcon="blog-main" class="nav__svg-main"></mat-icon>
          Истории
        </a>
      </li>

      <li class="nav__item">
        <a class="nav__link" routerLink="/casino">
          <mat-icon svgIcon="casino-main" class="nav__svg-main"></mat-icon>
          <span>new</span> Казино
        </a>
      </li>
    </ul>
  </nav>

  @if (authService.isAuthenticated() && authService.currentUser(); as user) {
    <div class="header__user-profile" [matMenuTriggerFor]="profileMenu">
      <span class="header__username">{{ user.username }}</span>
      <mat-icon svgIcon="account-user" class="header__user-icon"></mat-icon>
    </div>

    <mat-menu #profileMenu="matMenu" xPosition="before" class="profile-dropdown-menu">
      <div class="profile-menu__info">
        <p class="profile-menu__email">
          Email: <strong>{{ user.email }}</strong>
        </p>
        <p class="profile-menu__role">
          Роль:
          <span class="role-badge" [class.admin]="user.role === 'admin'">{{ user.role }}</span>
        </p>
      </div>

      <hr class="profile-menu__divider" />

      <button mat-menu-item (click)="toggleRole()">
        <mat-icon>sync</mat-icon>
        <span>Сделать {{ user.role === 'admin' ? 'Юзером' : 'Админом' }}</span>
      </button>

      <button mat-menu-item (click)="onLogout()">
        <mat-icon>logout</mat-icon>
        <span class="text-danger">Выйти</span>
      </button>
    </mat-menu>
  } @else {
    <button class="header__btn-login" (click)="openDialog()">Войти</button>
  }
</header>
